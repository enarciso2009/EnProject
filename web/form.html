<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Novo Relatório de Projeto</title>

</head>
    <link rel="stylesheet" href="/css/form.css">
<body>
    <div class="box">
        <h2>Cadastrar Acompanhamento de Projeto</h2>
        <form action="/gerar" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Nome do Projeto</label>
                <input type="text" name="nome_projeto" placeholder="Digite o nome oficial do projeto" required>
            </div>
            <div class="form-group">
                <label>Gerente do Projeto</label>
                <input type="text" name="gerente" placeholder="Responsável pelo projeto" required>
            </div>
            <div class="form-group">
                <label>Resumo Executivo</label>
                <textarea name="resumo" rows="3" placeholder="Breve resumo sobre o andamento atual do projeto..."></textarea>
            </div>
             
             <div class="form-group">
                <label>Observações deste projeto</label>
                <textarea name="observacoes" rows="2"></textarea>
            </div>
            <!-- NOVOS CAMPOS: Introdução, Localização e Encerramento -->
            <div class="form-group">
                <label>Introdução</label>
                <textarea name="introducao" rows="4" placeholder="Digite uma introdução sobre o contexto ou objetivo do projeto..."></textarea>
            </div>
            <div class="form-group">
                <label>Localização</label>
                <textarea name="localizacao" rows="2" placeholder="Endereço, coordenadas, galpões ou subestações onde o projeto ocorre..."></textarea>
            </div>
            
                        <h3>Tarefas do Projeto</h3>
            <div class="tarefa-header">
                <div>Nome da Tarefa</div>
                <div>Responsável</div>
                <div>Data Início</div>
                <div>Data Fim</div>
                <!-- 🌟 Adicionado o rótulo de progresso no cabeçalho -->
                <div class="center-lbl">Progresso (%)</div>
                <div class="center-lbl">Concluído?</div>
                <div class="center-lbl">Ação</div>
            </div>
            <div id="tarefas-container">
                <div class="tarefa-row">
                    <input type="text" name="tarefa_nome[]" placeholder="Ex: Ajustar API" required>
                    <input type="text" name="tarefa_resp[]" placeholder="Nome do dev" required>
                    <input type="date" name="tarefa_inicio[]" required>
                    <input type="date" name="tarefa_fim[]" required>
                    
                    <!-- 🌟 CORRIGIDO: Removido o input hidden e inserido o campo de progresso visível com a barra visual -->
                    <div class="progress-container">
                        <input type="number" name="tarefa_progresso[]" min="0" max="100" placeholder="%" required oninput="atualizarBarraVisual(this)">
                        <div class="progress-bar-bg" style="background: #e9ecef; border-radius: 4px; width: 60px; height: 8px; overflow: hidden; margin-top: 4px;">
                            <div class="progress-bar-fill" style="width: 0%; background: #28a745; height: 100%; transition: width 0.2s;"></div>
                        </div>
                    </div>

                    <input type="checkbox" onchange="vincularConclusao(this)">
                    <input type="hidden" name="tarefa_concluido[]" value="false">
                    <button type="button" class="btn-del" onclick="removerLinha(this)">X</button>
                </div>
            </div>
            <button type="button" class="btn-add" onclick="adicionarTarefa()">+ Adicionar Tarefa</button>

            <!-- SEÇÃO DE FOTOS AJUSTADA PARA BAIXO DAS TAREFAS -->
            <h3 style="margin-top: 25px;">📸 Fotos do Projeto</h3>
             <!-- SEU NOVO CABEÇALHO NO FORMULÁRIO -->
            <h4 style="margin: 10px 0 5px 0; color: #495057; font-size: 15px;">Upload de Evidências Visuais</h4>
            <p style="margin: 0 0 15px 0; color: #6c757d; font-size: 13px; font-weight: normal;">Insira as imagens que irão compor a galeria de fotos na visualização final do relatório.</p>

            
            <div class="form-group">
                <label for="imagens_projeto">Selecione uma ou mais imagens:</label>
                <input type="file" name="imagens_projeto[]" id="imagens_projeto" class="input-file-oculto" accept="image/*, .pdf,.doc,.docx,.xls,.xlsx,.zip" multiple onchange="visualizarImagens(this)">
                <div id="preview-imagens" class="preview-container"></div>
            </div>
            <!-- -------------------------------------------- -->

            <br><br>
            <a href="/" class="btn-voltar">Cancelar</a>
            <button type="submit">Salvar e Gerar Relatórios ✨</button>
        </form>
    </div>
    <script src="/js/form.js"></script>
</body>
</html>
